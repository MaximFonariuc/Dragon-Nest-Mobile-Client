// 以下处理Unity版本、Ant、Gradle兼容性问题
// 提供5.x Unity Gradle打包，对于较高版本gradle会自行处理，以下代码块可以忽略。
// Unity 2017及以上支持Gradle编译，不再需要msdk_unity_adapter。这也导致返回Internal编译的时候需要重新部署。
afterEvaluate {
    println "gradle version:" + gradle.gradleVersion
    if(gradle.gradleVersion.startsWith("2")){
        println "start delete excess resource"
        project.android.sourceSets.each {
            it.assets.srcDirs.each{
                file(it.absolutePath + "/beaconcomp").deleteDir()
                file(it.absolutePath + "/com.tencent.open.config.json").delete()
                file(it.absolutePath + "/libwbsafeedit").delete()
                file(it.absolutePath + "/libwbsafeedit_64").delete()
                file(it.absolutePath + "/libwbsafeedit_x86").delete()
                file(it.absolutePath + "/libwbsafeedit_x86_64").delete()
            }
        }
    }
    println "start delete excess unity adapter jar，if java can be compiled."
    project.android.sourceSets.each{
        def compileAble = false
        it.java.srcDirs.each{
            if(file(it.absolutePath).exists()){
                compileAble = true
            }
        }
        if(compileAble){
            def libsFiles = file("libs").listFiles()
            if(libsFiles != null){
                libsFiles.each {
                    if(it.name.startsWith("msdk_unity_adapter")){
                        if(!it.delete()){
                            println "delete extra msdk_unity_adapter jar failed"
                        }
                    }
                }
            }
        }
    }

}
